apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrogo-backend
  namespace: metrogo
  labels:
    app: metrogo
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrogo
      component: backend
  template:
    metadata:
      labels:
        app: metrogo
        component: backend
    spec:
      containers:
        - name: metrogo-backend
          image: 866409326671.dkr.ecr.eu-north-1.amazonaws.com/metrogo-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10