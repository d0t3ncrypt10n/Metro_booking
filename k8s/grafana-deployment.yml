# ============================================
# Grafana — In-Cluster Deployment
# ============================================

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: metrogo
  labels:
    app: metrogo
    component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrogo
      component: grafana
  template:
    metadata:
      labels:
        app: metrogo
        component: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "metrogo2026"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: datasource-config
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasource-config
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-storage
          emptyDir: {}

---
# Grafana Service — LoadBalancer for external access
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: metrogo
  labels:
    app: metrogo
    component: grafana
spec:
  type: LoadBalancer
  selector:
    app: metrogo
    component: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
# ConfigMap — Grafana Datasource (Prometheus)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: metrogo
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false

---
# ConfigMap — Grafana Dashboard Provider
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: metrogo
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: "MetroGo Dashboards"
        orgId: 1
        folder: "MetroGo"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

---
# ConfigMap — Grafana Dashboard JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: metrogo
data:
  metrogo-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "title": "API Request Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total[5m])) by (method)", "legendFormat": "{{method}}"}]
        },
        {
          "title": "API Latency P95",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95"}]
        },
        {
          "title": "OTP Requests",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "sum(rate(otp_requests_total[5m])) by (type, status)", "legendFormat": "{{type}}-{{status}}"}]
        },
        {
          "title": "Active Sessions",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "active_sessions_total", "legendFormat": "Sessions"}]
        }
      ],
      "schemaVersion": 39,
      "tags": ["metrogo"],
      "title": "MetroGo Backend Dashboard",
      "uid": "metrogo-k8s",
      "version": 1
    }
