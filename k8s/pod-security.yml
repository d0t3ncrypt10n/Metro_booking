# ==============================================================================
# Pod Security Standards (PSS) & Governance — MetroGo Namespace
# ==============================================================================
# This manifest applies namespace-level security hardening:
# 1. Pod Security Admission (PSA) labels to enforce the "restricted" security profile.
# 2. ResourceQuota to cap namespace-wide compute resources and prevent starvation.
# 3. LimitRange to ensure sensible default requests/limits for unconfigured pods.
# 4. PodDisruptionBudget to ensure backend high availability during maintenance.
# ==============================================================================

# Core Kubernetes API version for namespace configuration
apiVersion: v1

# Namespace resource manages isolation boundary and admission policies
kind: Namespace

# Metadata identifying the namespace and its security configuration labels
metadata:
  # The name of the project namespace
  name: metrogo
  # Labels configured on the namespace for admission controllers and metadata
  labels:
    # Identifies the application name
    app: metrogo
    # Identifies deployment environment tier
    environment: production
    # Pod Security Admission: Enforce the highest hardening profile ("restricted")
    pod-security.kubernetes.io/enforce: restricted
    # PSS version to enforce: "latest" pins rules to the current Kubernetes release standards
    pod-security.kubernetes.io/enforce-version: latest
    # Pod Security Admission: Audit violations against the "restricted" profile in audit logs
    pod-security.kubernetes.io/audit: restricted
    # PSS version to audit against
    pod-security.kubernetes.io/audit-version: latest
    # Pod Security Admission: Emit warnings to users applying pods violating "restricted" standards
    pod-security.kubernetes.io/warn: restricted
    # PSS version for warning emissions
    pod-security.kubernetes.io/warn-version: latest

---
# ==============================================================================
# ResourceQuota — Namespace Resource Budgeting and DoS Prevention
# ==============================================================================
# ResourceQuota restricts aggregate resource consumption within the namespace,
# preventing runaway processes or rogue pods from exhausting cluster-wide capacity.
# ==============================================================================

# Core Kubernetes API version for ResourceQuota
apiVersion: v1

# ResourceQuota resource type enforces total resource allocation caps
kind: ResourceQuota

# Metadata identifying name and target namespace
metadata:
  # Name of this ResourceQuota resource
  name: metrogo-resource-quota
  # Target namespace where quotas are enforced
  namespace: metrogo
  # Identifying labels for organizational governance
  labels:
    # Application identifier
    app: metrogo

# Specification defining the hard resource ceiling for the metrogo namespace
spec:
  # Hard limits dictionary specifying maximum permitted collective resources
  hard:
    # Total CPU requests allocated across all pods in this namespace (2 CPU cores)
    requests.cpu: "2"
    # Total Memory requests allocated across all pods in this namespace (2 Gigabytes)
    requests.memory: 2Gi
    # Total CPU limit cap across all pods in this namespace (4 CPU cores)
    limits.cpu: "4"
    # Total Memory limit cap across all pods in this namespace (4 Gigabytes)
    limits.memory: 4Gi
    # Maximum number of concurrent running pods allowed in this namespace
    pods: "10"
    # Maximum number of Kubernetes Services allowed in this namespace
    services: "5"
    # Maximum number of Persistent Volume Claims allowed in this namespace
    persistentvolumeclaims: "4"

---
# ==============================================================================
# LimitRange — Default and Bounded Resource Allocation Per Container
# ==============================================================================
# LimitRange automatically injects default CPU/Memory requests and limits into
# containers that do not explicitly define them, and enforces min/max boundaries.
# ==============================================================================

# Core Kubernetes API version for LimitRange
apiVersion: v1

# LimitRange resource type enforces per-container/per-pod resource constraints
kind: LimitRange

# Metadata identifying name and target namespace
metadata:
  # Name of this LimitRange resource
  name: metrogo-limit-range
  # Target namespace where limit defaults and constraints apply
  namespace: metrogo
  # Identifying labels for organizational governance
  labels:
    # Application identifier
    app: metrogo

# Specification describing the resource constraint rules
spec:
  # List of limit rules applied within the namespace
  limits:
    # Enforce constraints at the individual Container level
    - type: Container
      # Default limits assigned if a container omits limit declarations
      default:
        # Default CPU limit: 500 millicores (0.5 CPU core)
        cpu: "500m"
        # Default Memory limit: 512 Megabytes
        memory: "512Mi"
      # Default requests assigned if a container omits request declarations
      defaultRequest:
        # Default CPU request: 100 millicores (0.1 CPU core)
        cpu: "100m"
        # Default Memory request: 128 Megabytes
        memory: "128Mi"
      # Minimum resource request allowed for any single container
      min:
        # Minimum allowed CPU request: 50 millicores (0.05 CPU core)
        cpu: "50m"
        # Minimum allowed Memory request: 64 Megabytes
        memory: "64Mi"
      # Maximum resource limit allowed for any single container
      max:
        # Maximum allowed CPU limit: 1000 millicores (1 full CPU core)
        cpu: "1000m"
        # Maximum allowed Memory limit: 1 Gigabyte
        memory: "1Gi"

---
# ==============================================================================
# PodDisruptionBudget (PDB) — High Availability During Voluntary Disruptions
# ==============================================================================
# Ensures minimum backend pod availability during node drains, upgrades, and
# cluster maintenance events so user booking requests are never dropped.
# ==============================================================================

# Policy API version used for PodDisruptionBudget resources
apiVersion: policy/v1

# PodDisruptionBudget kind prevents simultaneous evictions during node maintenance
kind: PodDisruptionBudget

# Metadata identifying name and target namespace
metadata:
  # Name of this PodDisruptionBudget resource
  name: metrogo-backend-pdb
  # Target namespace where the target pods reside
  namespace: metrogo
  # Identifying labels for organizational governance
  labels:
    # Application identifier
    app: metrogo
    # Architectural tier protected by this disruption budget
    component: backend

# Specification declaring availability requirements and pod selector
spec:
  # Minimum number of backend pods that must remain running and available at all times
  minAvailable: 1
  # Selector matching the specific pods governed by this disruption budget
  selector:
    # Label matching rules
    matchLabels:
      # Target pods matching the application label
      app: metrogo
      # Target pods matching the backend component label
      component: backend
