# ==============================================================================
# Kubernetes NetworkPolicy — MetroGo Backend Security Isolation
# ==============================================================================
# In a zero-trust network model, pods should only accept necessary incoming
# traffic and only establish necessary outbound connections. This NetworkPolicy
# implements defense-in-depth for the MetroGo backend application layer.
# ==============================================================================

# Networking API version used for defining Kubernetes NetworkPolicy resources
apiVersion: networking.k8s.io/v1

# The kind of Kubernetes resource: NetworkPolicy controls layer 3/4 traffic flow
kind: NetworkPolicy

# Metadata identifying the name and namespace of this policy
metadata:
  # Unique resource name for this NetworkPolicy
  name: metrogo-backend-network-policy
  # Namespace where this policy is applied (must match backend pods namespace)
  namespace: metrogo
  # Standard organizational labels for querying and resource grouping
  labels:
    # Identifies the project/application name
    app: metrogo
    # Identifies the architectural component tier (backend microservice)
    component: backend

# Specification detailing which pods are targeted and what traffic is permitted
spec:
  # Pod selector determines WHICH pods this network policy applies to
  podSelector:
    # Match labels specify the key-value labels of pods to protect
    matchLabels:
      # Target pods with label app: metrogo
      app: metrogo
      # Target pods with label component: backend (the Node.js API pods)
      component: backend

  # Declares which traffic directions are controlled by this policy
  policyTypes:
    # Activate ingress rules: block all incoming traffic except explicit rules below
    - Ingress
    # Activate egress rules: block all outgoing traffic except explicit rules below
    - Egress

  # Whitelist of allowed incoming (ingress) traffic connections
  ingress:
    # Ingress Rule: Allow traffic from Frontend pods and the Load Balancer to port 3000
    - from:
        # Ingress source 1: Allow communication from frontend pods inside the cluster
        - podSelector:
            # Selector matching frontend pods
            matchLabels:
              # Label identifying MetroGo frontend client UI pods
              component: frontend
        # Ingress source 2: Allow external HTTP/HTTPS traffic arriving through Load Balancer
        - ipBlock:
            # 0.0.0.0/0 permits ingress traffic routed from external Load Balancer IP addresses
            cidr: 0.0.0.0/0
      # Ports on the backend container permitted to receive incoming traffic
      ports:
        # Layer 4 protocol: Transmission Control Protocol (TCP)
        - protocol: TCP
          # Target port: Backend Express.js server listens on port 3000
          port: 3000

  # Whitelist of allowed outgoing (egress) traffic connections
  egress:
    # Egress Rule 1: Allow backend pods to communicate with MongoDB database pods
    - to:
        # Destination pod selector for MongoDB pods
        - podSelector:
            # Selector matching database pods within the metrogo namespace
            matchLabels:
              # Label identifying the MongoDB database statefulset pods
              component: mongodb
      # Ports on the MongoDB container permitted to receive outbound traffic
      ports:
        # Layer 4 protocol: Transmission Control Protocol (TCP) for database connections
        - protocol: TCP
          # Target port: Default listening port for MongoDB daemon
          port: 27017

    # Egress Rule 2: Allow DNS resolution queries to CoreDNS / cluster DNS resolvers
    - ports:
        # UDP protocol for standard DNS domain and service name lookups
        - protocol: UDP
          # Standard Domain Name System (DNS) server port
          port: 53
        # TCP protocol for large DNS query responses and zone transfers fallback
        - protocol: TCP
          # Standard Domain Name System (DNS) server port
          port: 53
