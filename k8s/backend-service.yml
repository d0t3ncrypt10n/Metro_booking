# ============================================
# Service — MetroGo Backend API (LoadBalancer)
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: metrogo-backend-service
  namespace: metrogo
  labels:
    app: metrogo
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: metrogo
    component: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
