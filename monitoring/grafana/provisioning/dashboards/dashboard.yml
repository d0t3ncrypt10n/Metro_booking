# ============================================
# Grafana Dashboard Provider — Auto-Provision
# ============================================

apiVersion: 1

providers:
  - name: "MetroGo Dashboards"
    orgId: 1
    folder: "MetroGo"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
